<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <rect width="48" height="48" rx="12" fill="#282B4A"/>
  <!-- Dataset grid layer -->
  <rect x="12" y="12" width="10" height="4" rx="1.5" fill="#EEEBDA" fill-opacity="0.4"/>
  <rect x="12" y="19" width="14" height="4" rx="1.5" fill="#EEEBDA" fill-opacity="0.3"/>
  <rect x="12" y="26" width="8" height="4" rx="1.5" fill="#EEEBDA" fill-opacity="0.4"/>
  <rect x="12" y="33" width="12" height="4" rx="1.5" fill="#EEEBDA" fill-opacity="0.2"/>
  
  <!-- Optical Inspection Lens -->
  <circle cx="28" cy="24" r="11" stroke="#EEEBDA" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="28" cy="24" r="6" stroke="#EEEBDA" stroke-width="1.5" stroke-dasharray="2 3"/>
  <!-- Focus crosshairs -->
  <line x1="28" y1="15" x2="28" y2="18" stroke="#EEEBDA" stroke-width="2" stroke-linecap="round"/>
  <line x1="28" y1="30" x2="28" y2="33" stroke="#EEEBDA" stroke-width="2" stroke-linecap="round"/>
  <line x1="19" y1="24" x2="22" y2="24" stroke="#EEEBDA" stroke-width="2" stroke-linecap="round"/>
  <line x1="34" y1="24" x2="37" y2="24" stroke="#EEEBDA" stroke-width="2" stroke-linecap="round"/>
  <!-- Lens handle -->
  <line x1="36" y1="32" x2="41" y2="37" stroke="#EEEBDA" stroke-width="3" stroke-linecap="round"/>
  <!-- Central detection focal point -->
  <circle cx="28" cy="24" r="2" fill="#D97706"/>
</svg>
